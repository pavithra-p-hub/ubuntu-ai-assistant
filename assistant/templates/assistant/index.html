<!DOCTYPE html>
<html>
<head>
    <title>Ubuntu AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e7eb);
            color: #222;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .chat-box {
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fafafa;
        }

        .assistant-message {
            background: #eeeeee;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.6;
            border-left: 4px solid #333;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        button {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }

        button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 Ubuntu AI Assistant</h1>

    <div class="chat-box">

        {% if response %}
            <div class="assistant-message">
                <strong>Assistant:</strong><br>
                {{ response|safe }}
            </div>
        {% else %}
            <div class="assistant-message">
                <strong>Assistant:</strong><br>
                Hello! How can I help you?
            </div>
        {% endif %}

    </div>

    <form method="POST" onsubmit="showLoading()">
        {% csrf_token %}

        <div class="input-area">
            <input
                type="text"
                name="message"
                placeholder="Ask something..."
                required
            >

            <button type="submit">Send</button>
        </div>
    </form>

</div>
<script>
    function showLoading() {
        const button = document.querySelector("button");
        button.innerText = "Thinking...";
        button.disabled = true;
    }
</script>

</body>
</html>
